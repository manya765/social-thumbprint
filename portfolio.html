  /* DYNAMIC ASYMMETRIC GRID & GLASSMORPHISM */
  .work-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2.5rem;
      max-width: 1400px;
      margin: 0 auto;

  .work-card {
      position: relative;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 24px;
      overflow: hidden;
      display: block;
      text-decoration: none;
      opacity: 0; 
      transform: translateY(40px);
      transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.5s ease;
      aspect-ratio: 4/5;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
  }
  
  /* Feature some cards to span 2 columns */
  .work-card:nth-child(5n+1) {
      grid-column: span 2;
      grid-row: span 2;
      aspect-ratio: auto;
  }
  
  .work-card.in-view {
      opacity: 1;
      transform: translateY(0);
  }

      box-shadow: 0 20px 60px rgba(0, 176, 185, 0.4);
      transform: translateY(-5px);
  }

          grid-column: span 2;
          aspect-ratio: 16/9;
      }

          grid-template-columns: 1fr;

    /* Custom Fingerprint Cursor (Identical to index.html) */
    html {

    .cursor-fingerprint {
      position: fixed;
      top: 0;
      left: 0;
      width: 200px;
      height: 280px;
      pointer-events: none !important;
      z-index: 999999999 !important;
      transform: translate(-50%, -50%);
      transition: transform 0.15s ease, opacity 0.15s ease;
      opacity: 0.8;
      display: block !important;
      visibility: visible !important;
    }
    .cursor-fingerprint img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .cursor-fingerprint.stamping {
      transform: translate(-50%, -50%) scale(0.6) rotate(-15deg);
      opacity: 1;
    }

    body.modal-open .cursor-fingerprint,
    .modal-open .cursor-fingerprint {
      display: block !important;
      z-index: 999999999 !important;
      visibility: visible !important;
      opacity: 1 !important;
    }

  /* ============================================================
     DESIGN TOKENS
     ============================================================ */
  :root {
    --teal: #00B0B9;
    --teal-light: #4DD9E0;
    --teal-dark: #008B94;
    --purple: #3A2350; /* Purple for Navbar */
    --purple-soft: #4d2f6b;
    --white: #FFFFFF;
    --ink-soft: rgba(255, 255, 255, 0.78);
    --ink-faint: rgba(255, 255, 255, 0.55);

    --font-heading: 'Fraunces', serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;

    --container: 1180px;
    --radius-lg: 28px;
    --radius-md: 20px;
    --radius-sm: 12px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  /* Custom Cursor hiding default */
  html { scroll-behavior: smooth; cursor: none; overflow-x: hidden; }
  a, label { cursor: none; }
  input, textarea { cursor: text !important; }
  button, .btn { cursor: pointer !important; }

  body {
    background: var(--teal);
    color: var(--white);
    font-family: var(--font-body);
    line-height: 1.6;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* Custom Fingerprint Cursor */
  
  .cursor-fingerprint svg {
    width: 100%; height: 100%;
    fill: none;
    color: var(--teal-light);
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
  }
  
  /* Stamp effect when hovering clickables */
  
  

  /* Loading Screen */
  #loader {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 10000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: opacity 0.8s ease, visibility 0.8s ease;
  }
  #loader.hidden {
    opacity: 0;
    visibility: hidden;
  }
  .loader-fingerprint {
    width: 80px; height: 80px;
    fill: none;
    stroke: var(--teal);
    stroke-width: 2;
    stroke-dasharray: 500;
    stroke-dashoffset: 500;
    animation: scanIn 2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  }
  .loader-text {
    margin-top: 5px;
    font-family: var(--font-heading);
    font-size: 1.5rem;
    color: var(--white);
    opacity: 0;
    transform: translateY(10px);
    animation: textFadeIn 0.8s ease forwards 1.2s;
  }
  @keyframes scanIn {
    0% { 
      opacity: 0; 
      transform: translateY(30px) scale(0.95);
      -webkit-clip-path: inset(100% 0 0 0);
      clip-path: inset(100% 0 0 0); 
    }
    20% {
      opacity: 1;
    }
    100% { 
      opacity: 1; 
      transform: translateY(0) scale(1);
      -webkit-clip-path: inset(0 0 0 0);
      clip-path: inset(0 0 0 0); 
    }
  }
  
  /* Add a cool scanning line effect over it */
  .loader-fingerprint-wrapper {
    position: relative;
    display: inline-block;
  }
  .loader-fingerprint-wrapper::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--white);
    box-shadow: 0 0 10px var(--white);
    animation: scanLine 2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    opacity: 0;
  }
  #loader img { max-width: 70vw; max-height: 70vh; }
  @keyframes scanLine {
    0% { top: 100%; opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { top: 0%; opacity: 0; }
  }
  @keyframes textFadeIn {
    to { opacity: 1; transform: translateY(0); }
  }

  /* 3D Lighting Background */


  /* Animated Ambient Fingerprint Background */
  .bg-fingerprint {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    z-index: -1;
    pointer-events: none;
    background-color: var(--white);
    -webkit-mask: url('fingerprint.png') repeat center / 600px;
    mask: url('fingerprint.png') repeat center / 600px;
    opacity: 0.08;
    transform: translateZ(0); /* Hardware acceleration to fix Safari compositing */
  }
  
  /* Update blobs to also shift with mouse for gradient shifting effect */

    to { transform: rotate(360deg); }
  }

  .nav-cta {

    font-weight: 700;
    font-size: 0.86rem;
    transition: transform 0.2s ease, background 0.2s ease;
  }
  .nav-cta:hover { background: var(--teal-light); transform: translateY(-2px); color: var(--white); }

  /* Hero */
  .hero {
    padding-top: 8rem; padding-bottom: 5rem;
    display: flex; flex-direction: column; justify-content: center;
    text-align: center; position: relative;
    overflow: hidden;
    background: #000;
  }
  
  
  
  .hero-inner {
    display: flex; flex-direction: column; align-items: center;
    position: relative; z-index: 10;
  }
  
  /* Stagger load for Hero */
  .load-stagger {
    opacity: 0; transform: translateY(80px) translateZ(-150px) rotateX(20deg) scale(0.8);
    animation: loadIn3D 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
  }
  .load-stagger:nth-child(1) { animation-delay: 2.1s; }
  .load-stagger:nth-child(2) { animation-delay: 2.25s; }
  .load-stagger:nth-child(3) { animation-delay: 2.4s; }
  .load-stagger:nth-child(4) { animation-delay: 2.55s; }
  @keyframes loadIn3D {
    0% { opacity: 0; transform: translateY(80px) translateZ(-150px) rotateX(20deg) scale(0.8); }
    100% { opacity: 1; transform: translateY(0) translateZ(0) rotateX(0deg) scale(1); }
  }

  .hero-title {
    font-size: clamp(3.5rem, 7vw, 5.5rem);
    max-width: 900px; letter-spacing: -0.02em; line-height: 1.05;
    color: var(--white);
    text-shadow: none;
    transform: perspective(800px) rotateX(5deg);
  }
  .hero-title .highlight-wrapper {
    display: inline-block; position: relative;
  }
  .hero-title .highlight {
    position: relative; color: var(--teal);
    text-shadow: none;
    z-index: 2;
  }
  /* Giant Fingerprint Hover Effect */
  .giant-fingerprint {
    position: absolute;
    top: 50%; left: 50%;
    width: 500px; height: 500px;
    transform: translate(-50%, -50%) scale(0.5);
    opacity: 0;
    pointer-events: none;
    z-index: 1;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    background-image: url('fingerprint.png');
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    opacity: 0;
  }
  .highlight-wrapper:hover .giant-fingerprint {
    opacity: 0.8;
    transform: translate(-50%, -50%) scale(1);
  }

  .hero-intro { margin-top: 1.5rem; max-width: 560px; color: var(--ink-soft); font-size: 1.08rem; }
  .hero-actions { margin-top: 2.25rem; display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }

  /* Stats */
  @keyframes fadeUp {
    0% { opacity: 0; transform: translateY(30px) scale(0.96); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes floatAnimation {
    0% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
    100% { transform: translateY(0); }
  }
  .stats-section {
    padding: 6rem 0;
    position: relative;
    z-index: 5;
  }

  .stats-float {
    display: flex; align-items: stretch; justify-content: center; gap: 2rem;
    perspective: 1000px; /* For 3D effect during animation */
  }

  .stat { 
    flex: 1; text-align: center; padding: 2.5rem 1.5rem; 
    background: rgba(255, 255, 255, 0.88);
    -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: var(--radius-lg);
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
    
    /* Animation initial state */
    opacity: 0;
    transition: all 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  /* Fan-out starting positions */
  .stats-float:not(.in-view) .stat:nth-child(1) { transform: translateX(120%) scale(0.6) rotate(-15deg); }
  .stats-float:not(.in-view) .stat:nth-child(2) { transform: translateY(100px) scale(0.6); }
  .stats-float:not(.in-view) .stat:nth-child(3) { transform: translateX(-120%) scale(0.6) rotate(15deg); }

  /* Final positions */
  .stats-float.in-view .stat {
    opacity: 1;
    transform: translate(0) scale(1) rotate(0);
  }

  /* Stagger the entrance */
  .stats-float.in-view .stat:nth-child(1) { transition-delay: 0.1s; }
  .stats-float.in-view .stat:nth-child(2) { transition-delay: 0.3s; }
  .stats-float.in-view .stat:nth-child(3) { transition-delay: 0.5s; }

  /* Continuous floating after entrance */
  @keyframes individualFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  .stats-float.in-view .stat {
    animation: individualFloat 6s ease-in-out infinite;
  }
  .stats-float.in-view .stat:nth-child(1) { animation-delay: 1.3s; }
  .stats-float.in-view .stat:nth-child(2) { animation-delay: 1.5s; }
  .stats-float.in-view .stat:nth-child(3) { animation-delay: 1.7s; }

  .stat h3 { 
    font-size: clamp(2.2rem, 3.5vw, 3rem); 
    color: var(--teal); 
    margin-bottom: 0.5rem;
  }
  .stat p { 
    margin-top: 0; font-size: 0.95rem; color: var(--teal); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
  }
  .stat-divider { width: 1px; align-self: stretch; background: rgba(255, 255, 255, 0.12); }
  @media (max-width: 700px) {
    .stats-float { flex-direction: column; gap: 1.75rem; }
    .stat-divider { width: 60%; height: 1px; align-self: center; }
  }

  /* Services */
  .services-list { display: flex; flex-direction: column; width: 100%; gap: 1rem; margin-top: 2rem; }
  .service-list-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 2rem 2.5rem; 
    border: 1px solid rgba(255, 255, 255, 0.25);

  }
  .service-list-item:hover {
    background: rgba(255, 255, 255, 0.08);

  .service-list-content { display: flex; flex-direction: column; gap: 0.5rem; }
  .service-list-title {

  }
  .service-list-desc {

    transform: translateY(10px); transition: all 0.4s ease; max-height: 0; overflow: hidden;
  }
  .service-list-item:hover .service-list-title {

  }

  }
  .service-list-arrow {

  /* Hexagon Grid */
  .hex-section {
    padding: 3rem 0;
    margin-top: 2rem; margin-bottom: 5rem;
    position: relative;
    overflow: visible;
  }
  @keyframes driftGrid {
    from { transform: translateX(300px); }
    to { transform: translateX(-300px); }
  }
  .hex-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: visible;
    width: 100vw;
    margin-left: calc(-50vw + 50%); /* Full bleed horizontal */
    animation: driftGrid 20s linear infinite;
    will-change: transform;
  }
  .hex-row {
    display: flex;
    justify-content: center;
    margin-bottom: -69px; /* Overlap for honeycomb effect */
    width: 100%;
    flex-wrap: nowrap;
  }
  .hex {
    flex-shrink: 0;
    width: 240px;
    height: 276px;
    background: rgba(255, 255, 255, 0.15);
    -webkit-clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    margin: 0 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-family: var(--font-heading);
    font-size: 0.95rem;

    color: var(--white);
    -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    
    /* Animation state for zoom-in on scroll */
    opacity: 0;
    transform: scale(0.3);
    transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .hex img { 
    max-width: 75%; 
    max-height: 75%; 
    object-fit: contain; 
    pointer-events: none;

  .hex.in-view {
    opacity: 1;
    transform: scale(1);
  }
  .hex:hover {
    transform: scale(1.15) !important;
    background: var(--teal-light);
    color: var(--purple);
    z-index: 10;
  }
  /* Stagger animation */
  .hex:nth-child(1) { transition-delay: 0.05s; }
  .hex:nth-child(2) { transition-delay: 0.15s; }
  .hex:nth-child(3) { transition-delay: 0.25s; }
  .hex:nth-child(4) { transition-delay: 0.35s; }
  .hex:nth-child(5) { transition-delay: 0.45s; }

  /* Testimonials */
  .testimonial-card {
    max-width: 900px; margin: 0 auto; background: rgba(255, 255, 255, 0.88);

  /* Founder Section */
  .founder-section {

    .thumbprint-cards-container {

    .tp-card {
      background: #f4f5f7;
      border-radius: 24px;
      padding: 22px 18px 16px 18px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 310px;
      text-decoration: none !important;
      border: 1px solid rgba(0, 0, 0, 0.04);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.02);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.35s ease, border-color 0.35s ease, background-color 0.35s ease;
    }

    .tp-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
      border-color: rgba(0, 176, 185, 0.3);
      background: #ffffff;
    }

    /* Teal Background Thumbprints inside Card */
    .tp-card::before {
      content: '';
      position: absolute;
      bottom: -20px;
      left: -20px;
      width: 180px;
      height: 180px;
      background-color: #00b0b9;
      -webkit-mask: url('fingerprint.png') no-repeat center / contain;
      mask: url('fingerprint.png') no-repeat center / contain;
      opacity: 0.14;
      z-index: 1;
      pointer-events: none;
      transition: transform 0.5s ease, opacity 0.5s ease;
      transform: rotate(-15deg);
    }

    .tp-card::after {
      content: '';
      position: absolute;
      top: -25px;
      right: -25px;
      width: 140px;
      height: 140px;
      background-color: #00b0b9;
      -webkit-mask: url('fingerprint.png') no-repeat center / contain;
      mask: url('fingerprint.png') no-repeat center / contain;
      opacity: 0.10;
      z-index: 1;
      pointer-events: none;
      transition: transform 0.5s ease, opacity 0.5s ease;
      transform: rotate(35deg);
    }

    .tp-card:hover::before {
      opacity: 0.25;
      transform: rotate(0deg) scale(1.15);

<script>

  // Stamp effect on hover
  document.querySelectorAll('a, button, input, textarea, label, img, .service-card').forEach(el => {
    el.addEventListener('mouseenter', () => cursor.classList.add('stamping'));
    el.addEventListener('mouseleave', () => cursor.classList.remove('stamping'));
  });

  // Dynamically inject brand titles into cards
  document.querySelectorAll('.brand-card').forEach(card => {
    const brand = card.getAttribute('data-brand');
    const info = card.querySelector('.work-info');
    if (brand && info && !info.querySelector('h4')) {
      const h4 = document.createElement('h4');
      h4.textContent = brand;
      info.insertBefore(h4, info.firstChild);
    }
  });

  // Animated stat count-up
  (function () {
    var statsFloat = document.getElementById('statsFloat');
    if (!statsFloat) return;
    var numbers = statsFloat.querySelectorAll('h3[data-target]');
    var hasAnimated = false;
    var duration = 2000;
    function animate(el) {
      var target = parseFloat(el.getAttribute('data-target'));
      var prefix = el.getAttribute('data-prefix') || '';
      var suffix = el.getAttribute('data-suffix') || '';
      var start = null;
      function step(ts) {
        if (start === null) start = ts;
        var progress = Math.min((ts - start) / duration, 1);
        var eased = 1 - Math.pow(1 - progress, 3);
        var current = Math.floor(eased * target);
        el.textContent = prefix + current + suffix;
        if (progress < 1) requestAnimationFrame(step);
        else el.textContent = prefix + target + suffix;
      }
      requestAnimationFrame(step);
    }
    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting && !hasAnimated) {
          hasAnimated = true;
          
          // Expand and fade in the container
          entry.target.classList.add('in-view');
          
          // 800ms delay to let the expansion animation finish, then start counting
          setTimeout(function() {
            numbers.forEach(animate);
          }, 800);
          
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.3 });
    observer.observe(statsFloat);
  })();

  // Reveal cards
  (function () {
    var revealObserver = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('in-view');
          revealObserver.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1 });

    document.addEventListener('DOMContentLoaded', () => {
      const cards = document.querySelectorAll('.sm-stack-card');

      const nextBtn = document.getElementById('stackNextBtn');
      const counterText = document.getElementById('stackCounterText');
      const stage = document.getElementById('smStackStage');

      if (!cards.length) return;

      const totalCards = cards.length;
      let activeIndex = 0;
      let isAnimating = false;
      let autoTimer = null;
      let isPaused = false;

      function renderStack() {
        cards.forEach((card, i) => {
          // Remove previous position classes
          card.classList.remove(
            'sm-pos-center',
            'sm-pos-right-1',
            'sm-pos-right-2',
            'sm-pos-left-1',
            'sm-pos-left-2',
            'sm-pos-hidden'
          );

          // Calculate relative position index from activeIndex
          const offset = (i - activeIndex + totalCards) % totalCards;

          if (offset === 0) {
            card.classList.add('sm-pos-center');
          } else if (offset === 1) {
            card.classList.add('sm-pos-right-1');
          } else if (offset === 2) {
            card.classList.add('sm-pos-right-2');
          } else if (offset === totalCards - 1) {
            card.classList.add('sm-pos-left-1');
          } else if (offset === totalCards - 2) {
            card.classList.add('sm-pos-left-2');
          } else {
            card.classList.add('sm-pos-hidden');
          }
        });

        if (counterText) {
          counterText.textContent = `${activeIndex + 1} / ${totalCards}`;
        }
      }

      function nextCard() {
        if (isAnimating) return;
        isAnimating = true;

        activeIndex = (activeIndex + 1) % totalCards;
        renderStack();

        setTimeout(() => {
          isAnimating = false;
        }, 550);
      }

      function prevCard() {
        if (isAnimating) return;
        isAnimating = true;

        activeIndex = (activeIndex - 1 + totalCards) % totalCards;
        renderStack();

        setTimeout(() => {
          isAnimating = false;
        }, 500);
      }

      // Event Listeners
      if (nextBtn) nextBtn.addEventListener('click', nextCard);
      if (prevBtn) prevBtn.addEventListener('click', prevCard);

      // Click card in stack to bring to front
      cards.forEach((card, idx) => {
        card.addEventListener('click', () => {
          if (idx !== activeIndex && !isAnimating) {
            isAnimating = true;
            activeIndex = idx;
            renderStack();
            setTimeout(() => { isAnimating = false; }, 500);
          }
        });
      });

      // Auto Play Timer
      function startAutoPlay() {
        if (autoTimer) clearInterval(autoTimer);
        autoTimer = setInterval(() => {
          if (!isPaused && !document.hidden) {
            nextCard();
          }
        }, 2500);

      if (stage) {

            card.style.opacity = '0';
          }
        });

        tabHeadings.forEach(tab => {
          if (tab.getAttribute('data-filter') === targetCat) {
            tab.classList.add('active');
            tab.style.color = '#00b0b9';
            tab.style.borderBottomColor = '#00b0b9';
          } else {
            tab.classList.remove('active');
            tab.style.color = '#524b38';
            tab.style.borderBottomColor = 'transparent';
          }
        });
      }

      tabHeadings.forEach(tab => {
        tab.addEventListener('click', (e) => {
          e.preventDefault();
          const filterValue = tab.getAttribute('data-filter');
          filterMockups(filterValue);
        });
      });

      // Initialize with URL query parameter filter or active tab
      const urlParams = new URLSearchParams(window.location.search);
      const initialCat = urlParams.get('filter') || window.location.hash.replace('#', '') || 'social-media';
      filterMockups(initialCat);
    });
  </script>

</body>
</html>
